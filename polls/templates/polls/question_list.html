{% load static tailwind_tags %}
<!doctype html>
<html lang="en-US" class="h-full w-full">
  <head>
    <meta charset="utf-8" />
    {% load static %}

<link rel="stylesheet" href="{% static 'polls/style.css' %}">
<!--<img class="w-full" src="{% static 'polls/images/background.jpg' %}">-->
    <title>My test page</title>
    {% tailwind_css %}

  </head>
  <body class="h-full">

    {% if latest_question_list %}
    <ul class="p-16">
    {% for question in latest_question_list %}
        <li><a class="text-7xl !text-rose-500" href="{% url 'polls:detail' question.id %}">{{question.question_text}}</a></li>
        {% endfor %}
    </ul>
    {% else %}
        <p>No polls are available.</p>
    {% endif %}

  </body>
</html>
